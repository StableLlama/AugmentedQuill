[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "AugmentedQuill"
version = "0.1.0"
description = "Web GUI for LLM assisted prose writing"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "StableLlamaAI"},
]
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.5",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.26",
    "jsonschema>=4.26.0",
    "EbookLib>=0.18",
    "beautifulsoup4>=4.12",
    "ddgs>=9.5",
    "Markdown>=3.6",
    "jellyfish>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16.1,<0.17.0",
    "black>=26.3.1",
    "requests>=2.33.0",
    "pre-commit",
]

[project.scripts]
augmentedquill = "augmentedquill.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["augmentedquill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "S101", "S104", "COM812", "ISC001", "BLE001", "S110", "S112", "TRY004", "ASYNC230"]
per-file-ignores = {"tests/**/*" = ["S101", "ARG", "FBT", "PLR2004"]}

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''